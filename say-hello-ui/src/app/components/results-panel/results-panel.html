<table>
    <tr>
        <th>Status</th>
        <th>Listening For</th>
    </tr>
    <tr>
        <td>
            <app-results-status [status]="getStatus('hello')"></app-results-status>
        </td>
        <td>
            hello
        </td>
    </tr>
    <tr>
        <td>
            <app-results-status [status]="getStatus('hi')"></app-results-status>
        </td>
        <td>
            hi
        </td>
    </tr>
        <tr>
        <td>
            <app-results-status [status]="getStatus('hey')"></app-results-status>
        </td>
        <td>
            hey
        </td>
    </tr>
    <tr>
        <td>
            <app-results-status [status]="getStatus(helloText)"></app-results-status>        </td>
        <td>
            <input 
                (keyup)="updateMatch($event)"
                type="text"
                [value]="helloText"
            >
        </td>
    </tr>
    <tr>
        <td>
            <mat-icon class="ready">record_voice_over</mat-icon>
        </td>
        <td>
            @if(shVoiceService.normalizedVoiceRecognitionResultSignal() === '') {
                 status: Listening for results
            } @else {
                results: <strong>"{{ shVoiceService.voiceRecognitionResultSignal() }}"</strong>
            }
        </td>
    </tr>
</table>
